[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-amp-pred"
version = "0.1.0"
description = "Predict peptide antibacterial activity with sAMPle's bundled classifier"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "sAMPle project" }]
keywords = ["antimicrobial-peptides", "amp", "bioinformatics", "machine-learning", "sample-database"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "rdkit>=2023.3",
    "peptides>=0.3",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://sample-database.org"
Source = "https://github.com/omixlab/sample-amp-pred"

[project.scripts]
sample-amp-pred = "sample_amp_pred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sample_amp_pred = ["data/*.pkl"]
